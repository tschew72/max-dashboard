# =============================================================================
# Evvo Labs — Secrets Detection Pipeline
# Triggers: push to any branch, pull_request
# Tools: GitLeaks, TruffleHog, detect-secrets
# Policy: FAIL on ANY verified secret (zero tolerance)
# =============================================================================
name: "🔑 Secrets — Credential Leak Detection"

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # GitLeaks — fast, low-FP secret scanner
  # Primary tool for all repos
  # ---------------------------------------------------------------------------
  gitleaks:
    name: "GitLeaks Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: PRO tier

  # ---------------------------------------------------------------------------
  # TruffleHog — deep verification, low false positives
  # Verifies secrets are active (actually connects to services)
  # ---------------------------------------------------------------------------
  trufflehog:
    name: "TruffleHog Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog Git Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: TruffleHog Filesystem Scan
        run: |
          docker run --rm -v "$PWD:/src" trufflesecurity/trufflehog:latest \
            filesystem --directory /src --only-verified --json > trufflehog-results.json 2>/dev/null || true

      - name: TruffleHog Summary
        if: always()
        run: |
          echo "## 🔑 TruffleHog Results" >> $GITHUB_STEP_SUMMARY
          if [ -f trufflehog-results.json ] && [ -s trufflehog-results.json ]; then
            COUNT=$(grep -c '"' trufflehog-results.json 2>/dev/null || echo "0")
            echo "⚠️ Verified secrets found: $COUNT" >> $GITHUB_STEP_SUMMARY
            echo "::error::TruffleHog found verified secrets in repository"
          else
            echo "✅ No verified secrets found" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # detect-secrets — Yelp's baseline approach
  # Good for maintaining .secrets.baseline file
  # ---------------------------------------------------------------------------
  detect-secrets:
    name: "Detect Secrets (Baseline)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files --baseline .secrets.baseline 2>/dev/null || true

          # If baseline file existed before, compare
          if git rev-parse HEAD 2>/dev/null; then
            NEW_SECRETS=$(detect-secrets scan --all-files 2>/dev/null | \
              python3 -c "
          import json, sys
          try:
              results = json.load(sys.stdin)
              for filename, secrets in results.get('results', {}).items():
                  for secret in secrets:
                      print(f'{filename}:{secret.get(\"line_number\", \"?\")} — {secret.get(\"type\", \"unknown\")}')
          except:
              pass
          ")
            if [ -n "$NEW_SECRETS" ]; then
              echo "::error::New secrets detected:"
              echo "$NEW_SECRETS"
              echo "## 🚨 New Secrets Detected" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$NEW_SECRETS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi
          echo "✅ No new secrets detected" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # GitGuardian — PRO TIER (requires GG_API_KEY)
  # Best-in-class detection, SOC2-compliant, team alerts
  # ---------------------------------------------------------------------------
  gitguardian:
    name: "GitGuardian (PRO)"
    runs-on: ubuntu-latest
    if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          args: secret scan ci

  # ---------------------------------------------------------------------------
  # Summary & Alert
  # ---------------------------------------------------------------------------
  secrets-summary:
    name: "Secrets Scan Summary & Alert"
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: always()
    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.gitleaks.result }}" = "failure" ] || [ "${{ needs.trufflehog.result }}" = "failure" ]; then
            echo "::error::SECRETS DETECTED IN REPOSITORY — immediate rotation required"
            exit 1
          fi
          echo "✅ No secrets leaked"

      - name: Notify Discord on Secret Found
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚨🚨🚨 **SECRETS LEAKED** — \${{ github.event.repository.name }} — IMMEDIATE ACTION REQUIRED — rotate all exposed credentials\",
              \"embeds\": [{
                \"title\": \"Credential Leak Detected\",
                \"color\": 16711680,
                \"fields\": [
                  {\"name\": \"Repo\", \"value\": \"\${{ github.event.repository.name }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"\${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"Action\", \"value\": \"Rotate all exposed credentials immediately\", \"inline\": false}
                ]
              }]
            }"
