# =============================================================================
# Evvo Labs — Supply Chain Security Pipeline
# Triggers: push to main/staging, pull_request, weekly schedule
# Tools: Grype, Trivy SBOM, npm audit, dependency-review
# Policy: FAIL on CRITICAL CVEs, warn on HIGH
# =============================================================================
name: "📦 Supply Chain — Dependency & Container Scan"

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC (2PM SGT)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FAIL_ON_SEVERITY: "CRITICAL"
  TRIVY_SEVERITY: "HIGH,CRITICAL"

jobs:
  # ---------------------------------------------------------------------------
  # npm audit — built-in Node.js dependency check
  # ---------------------------------------------------------------------------
  npm-audit:
    name: "npm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit
        run: |
          npm audit --audit-level=high --json > npm-audit-results.json 2>/dev/null || true
          npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities"

      - name: Audit Summary
        if: always()
        run: |
          echo "## 📦 npm Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f npm-audit-results.json ]; then
            python3 -c "
            import json
            with open('npm-audit-results.json') as f:
                data = json.load(f)
            meta = data.get('metadata', {})
            vulns = meta.get('vulnerabilities', {})
            total = sum(vulns.values())
            print(f'Total: {total} | Critical: {vulns.get(\"critical\", 0)} | High: {vulns.get(\"high\", 0)} | Moderate: {vulns.get(\"moderate\", 0)} | Low: {vulns.get(\"low\", 0)}')
            if vulns.get('critical', 0) > 0:
                print('❌ CRITICAL vulnerabilities found — immediate action required')
            " >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Trivy — SBOM generation + filesystem/container vulnerability scan
  # Free, comprehensive CVE database
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: "Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Grype — Anchore's vulnerability scanner (alternative to Trivy)
  # Better for Docker images, good CI integration
  # ---------------------------------------------------------------------------
  grype-scan:
    name: "Grype Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Grype scan
        uses: anchore/scan-action@v6
        with:
          path: "."
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: grype

  # ---------------------------------------------------------------------------
  # GitHub Dependency Review — checks for known vulns in PR diffs
  # Free for all GitHub repos
  # ---------------------------------------------------------------------------
  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          vulnerability-check: true
          license-check: true

  # ---------------------------------------------------------------------------
  # Socket.dev — PRO TIER (requires API key)
  # Real-time supply chain threat detection, typo-squatting, malware detection
  # ---------------------------------------------------------------------------
  socket-dev:
    name: "Socket.dev Supply Chain (PRO)"
    runs-on: ubuntu-latest
    if: ${{ secrets.SOCKET_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Socket Security Scan
        uses: socketsdev/socket-security-action@v1
        with:
          socket-api-key: ${{ secrets.SOCKET_API_KEY }}
          severity: critical
          issue-type: all

  # ---------------------------------------------------------------------------
  # dependency-cruiser — validate dependency structure & rules
  # Catches circular deps, orphan deps, violate layering rules
  # ---------------------------------------------------------------------------
  dep-cruiser:
    name: "Dependency Cruiser"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install dependency-cruiser
        run: npm install --no-save dependency-cruiser

      - name: Run dependency-cruiser
        run: |
          npx depcruise --config .dependency-cruiser.js src/ --output-type err-html --output-to dep-cruise-report.html 2>/dev/null || true
          npx depcruise --config .dependency-cruiser.js src/ --output-type err-long || echo "::warning::dependency-cruiser found issues"
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Container image scan (when Dockerfile present)
  # ---------------------------------------------------------------------------
  container-scan:
    name: "Container Image Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check for Dockerfile
        id: check-docker
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_docker=true" >> $GITHUB_OUTPUT
          else
            echo "has_docker=false" >> $GITHUB_OUTPUT
          fi

      - name: Build image
        if: steps.check-docker.outputs.has_docker == 'true'
        run: docker build -t scan-target:${{ github.sha }} .

      - name: Trivy container scan
        if: steps.check-docker.outputs.has_docker == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-container-results.sarif'

      - name: Grype container scan
        if: steps.check-docker.outputs.has_docker == 'true'
        uses: anchore/scan-action@v6
        with:
          image: scan-target:${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Upload container scan results
        if: always() && steps.check-docker.outputs.has_docker == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

  # ---------------------------------------------------------------------------
  # Supply chain summary
  # ---------------------------------------------------------------------------
  supply-chain-summary:
    name: "Supply Chain Summary & Alert"
    runs-on: ubuntu-latest
    needs: [npm-audit, trivy-fs, grype-scan, dep-cruiser]
    if: always()
    steps:
      - name: Results Summary
        run: |
          echo "## 📦 Supply Chain Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy FS | ${{ needs.trivy-fs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Grype | ${{ needs.grype-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dep Cruiser | ${{ needs.dep-cruiser.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord on Failure
        if: |
          needs.npm-audit.result == 'failure' ||
          needs.trivy-fs.result == 'failure' ||
          needs.grype-scan.result == 'failure'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚨 **SUPPLY CHAIN SCAN FAILED** — \${{ github.event.repository.name }}\",
              \"embeds\": [{
                \"title\": \"Vulnerable Dependencies Found\",
                \"fields\": [
                  {\"name\": \"Repo\", \"value\": \"\${{ github.event.repository.name }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"\${{ github.ref_name }}\", \"inline\": true}
                ]
              }]
            }"
